<div class="employee-list">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h2>Employee List</h2>
            <p>Manage all employees</p>
        </div>

        <button mat-raised-button color="primary" routerLink="/admin/new-employee">
            <mat-icon>add</mat-icon>
            Add Employee
        </button>
    </div>

    <!-- Employee Table -->
    <div class="table-container">

        <table mat-table [dataSource]="(employeeList$ | async) ?? []" class="employee-table">

            <!-- Employee ID -->
            <ng-container matColumnDef="employeeId">

                <th mat-header-cell *matHeaderCellDef>
                    ID
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.employeeId }}
                </td>

            </ng-container>

            <!-- Employee Name -->
            <ng-container matColumnDef="employeeName">

                <th mat-header-cell *matHeaderCellDef>
                    Employee Name
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.employeeName }}
                </td>

            </ng-container>

            <!-- Contact -->
            <ng-container matColumnDef="contactNo">

                <th mat-header-cell *matHeaderCellDef>
                    Contact No
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.contactNo }}
                </td>

            </ng-container>

            <!-- Email -->
            <ng-container matColumnDef="emailId">

                <th mat-header-cell *matHeaderCellDef>
                    Email
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.emailId }}
                </td>

            </ng-container>

            <!-- Gender -->
            <ng-container matColumnDef="gender">

                <th mat-header-cell *matHeaderCellDef>
                    Gender
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.gender }}
                </td>

            </ng-container>

            <!-- Role -->
            <ng-container matColumnDef="role">

                <th mat-header-cell *matHeaderCellDef>
                    Role
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.role }}
                </td>

            </ng-container>

            <!-- Created Date -->
            <ng-container matColumnDef="createdDate">

                <th mat-header-cell *matHeaderCellDef>
                    Created Date
                </th>

                <td mat-cell *matCellDef="let employee">
                    {{ employee.createdDate | date:'dd-MM-yyyy' }}
                </td>

            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">

                <th mat-header-cell *matHeaderCellDef>
                    Actions
                </th>

                <td mat-cell *matCellDef="let employee">

                    <button
                        mat-icon-button
                        color="primary"
                        aria-label="Edit employee">

                        <mat-icon>edit</mat-icon>

                    </button>

                    <button
                        mat-icon-button
                        color="warn"
                        aria-label="Delete employee">

                        <mat-icon>delete</mat-icon>

                    </button>

                </td>

            </ng-container>

            <!-- Header Row -->
            <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns">
            </tr>

            <!-- Data Row -->
            <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns;">
            </tr>

        </table>

    </div>

</div>
